services:
  - type: web
    name: saha-gaming-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_FILE
        value: /tmp/saha.db
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SAHA_OWNER_DISCORD_ID
        value: 1567653785071779850
      - key: SAHA_NETWORK_KEY
        generateValue: true
